name: Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run canonical test suite
        run: python -m unittest discover -s tests -v
      - name: Package and validate release artifact on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          zip -r "$RUNNER_TEMP/hikari-release.zip" . -x ".git/*" "*/__pycache__/*" "__pycache__/*" "*.pyc"
          python tests/release_preflight.py "$RUNNER_TEMP/hikari-release.zip"
