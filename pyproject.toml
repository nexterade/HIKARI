[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hikari-lab"
version = "0.6.8"
description = "HIKARI/.LAB — cyberpunk Git/GitHub workflow automation console"
requires-python = ">=3.10"

[project.scripts]
hikari = "hikari.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
